id = "kumikit.provider-acp"
name = "ACP agents"
version = "0.1.0"
description = "Runs any agent that speaks the Agent Client Protocol, from a manifest entry."
license = "MIT"
repository = "https://github.com/kumikit/kumikit"
kind = ["provider"]
api = "^0.2"

[runtime]
wasm = "plugin.wasm"
worlds = ["kumikit:provider/plugin@0.2.0", "kumikit:turn/provider@0.1.0"]

[contributes]
provider-backends = [{ key = "acp", schema = "acp.schema.json" }]
