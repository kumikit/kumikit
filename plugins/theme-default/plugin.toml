id = "kumikit.theme-default"
name = "Kumikit"
version = "0.1.0"
description = "The default light and dark themes; the fallback for tokens other themes leave out."
license = "MIT"
repository = "https://github.com/kumikit/kumikit"
kind = ["theme"]
api = "^0.1"

[theme]
variants = [
  { id = "light", name = "Light", appearance = "light", tokens = "light.json" },
  { id = "dark", name = "Dark", appearance = "dark", tokens = "dark.json" },
]
