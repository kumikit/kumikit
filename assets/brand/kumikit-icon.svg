<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Kumikit</title>
  <!-- Asanoha (hemp leaf), the classic kumiko pattern: a hexagon split into six
       triangles, each joined to its centre. Kumiko is Japanese woodwork in which a
       lattice is assembled from many small pieces without nails. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a33"/>
      <stop offset="1" stop-color="#070912"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="60" y1="36" x2="196" y2="220">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="128" cy="128" r="110" fill="url(#glow)"/>
  <g fill="none" stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="12" d="M128.0 42.0 L202.5 85.0 L202.5 171.0 L128.0 214.0 L53.5 171.0 L53.5 85.0 Z"/>
    <path stroke-width="9" d="M128.0 128.0 L128.0 42.0 M128.0 128.0 L202.5 85.0 M128.0 128.0 L202.5 171.0 M128.0 128.0 L128.0 214.0 M128.0 128.0 L53.5 171.0 M128.0 128.0 L53.5 85.0"/>
    <path stroke-width="5.5" d="M128.0 42.0 L152.8 85.0 L202.5 85.0 M152.8 85.0 L128.0 128.0 M202.5 85.0 L177.7 128.0 L202.5 171.0 M177.7 128.0 L128.0 128.0 M202.5 171.0 L152.8 171.0 L128.0 214.0 M152.8 171.0 L128.0 128.0 M128.0 214.0 L103.2 171.0 L53.5 171.0 M103.2 171.0 L128.0 128.0 M53.5 171.0 L78.3 128.0 L53.5 85.0 M78.3 128.0 L128.0 128.0 M53.5 85.0 L103.2 85.0 L128.0 42.0 M103.2 85.0 L128.0 128.0"/>
  </g>
</svg>
