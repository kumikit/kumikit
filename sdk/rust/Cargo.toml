[package]
name = "kumikit-plugin"
description = "Guest-side SDK for Kumikit core plugins (WASM components)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wit-bindgen = { version = "0.61.1", default-features = false, features = ["macros", "realloc", "std", "bitflags"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasi:http bindings for the `http` module (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT).
wasip2 = "1.0.4"
