<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Kumikit</title>
  <!-- Asanoha (hemp leaf), the classic kumiko pattern: a hexagon split into six
       triangles, each joined to its centre. Kumiko is Japanese woodwork in which a
       lattice is assembled from many small pieces without nails. -->
