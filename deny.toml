# Dependency policy, checked in CI with cargo-deny. The licence allowlist is the one in
# AGENTS.md (Security and privacy), plus Unicode-3.0, accepted in the M0 plan because
# unicode-ident (under every derive macro) uses it. SQLite, compiled in by rusqlite's
# `bundled` feature, is public-domain C source and carries no crate licence entry.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
