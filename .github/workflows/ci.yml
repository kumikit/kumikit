name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # On pull requests, skip unaffected heavy jobs. On main, every job runs unconditionally.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      protocol: ${{ steps.filter.outputs.protocol }}
      templates: ${{ steps.filter.outputs.templates }}
      licenses: ${{ steps.filter.outputs.licenses }}
      installers: ${{ steps.filter.outputs.installers }}
      e2e: ${{ steps.filter.outputs.e2e }}
      installer-matrix: ${{ steps.matrix.outputs.installers }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/**'
              - 'sdk/**'
              - 'wit/**'
              - 'plugins/provider-acp/**'
              - 'test-plugins/**'
              - '.github/workflows/ci.yml'
            web:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'web/**'
              - 'plugins/ui-*/**'
              - 'plugins/theme-*/**'
              - 'test-plugins/ui-panel/**'
              - 'scripts/bundle.mjs'
              - '.github/workflows/ci.yml'
            protocol:
              - 'crates/kumikit-protocol/**'
              - 'web/protocol/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            templates:
              - 'templates/**'
              - 'sdk/**'
              - 'wit/**'
              - 'web/sdk/**'
              - 'crates/kumikit-core/**'
              - 'crates/kumikit-package/**'
              - 'crates/kumikit-plugin-host/**'
              - 'crates/kumikit-theme/**'
              - 'scripts/check-templates.sh'
              - 'scripts/template-turn.mjs'
              - '.github/workflows/ci.yml'
            licenses:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            installers:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/kumikit-shell/**'
              - 'crates/kumikit-core/**'
              - 'web/**'
              - 'plugins/**'
              - 'scripts/bundle.mjs'
              - 'scripts/repack-appimage.mjs'
              - 'scripts/smoke-appimage.sh'
              - 'scripts/check-installer-size.mjs'
              - '.github/workflows/ci.yml'
            e2e:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'crates/**'
              - 'sdk/**'
              - 'wit/**'
              - 'web/**'
              - 'plugins/**'
              - 'test-plugins/**'
              - 'scripts/bundle.mjs'
              - 'scripts/desktop/**'
              - 'scripts/footprint.sh'
              - '.github/workflows/ci.yml'
      - id: matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'installers=[{"os":"ubuntu-22.04","bundles":"deb,rpm,appimage"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'installers=[{"os":"ubuntu-22.04","bundles":"deb,rpm,appimage"},{"os":"macos-latest","bundles":"dmg"},{"os":"windows-latest","bundles":"nsis"}]' >> "$GITHUB_OUTPUT"
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-docs.sh
      - run: sh scripts/check-plugin-names.sh
      - run: sh scripts/check-no-keys.sh

  protocol-ts:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The generated package must type-check; the version matches web/protocol/package.json.
      - run: npx --yes -p typescript@7.0.2 tsc --noEmit -p web/protocol

  web:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/check-npm-licenses.mjs
      # The UI kernel's compressed JS size against its budget (00-overview).
      - run: node scripts/size.mjs
        working-directory: web/kernel

  licenses:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  rust:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Faster host linking on Linux without affecting wasm32-wasip2 or other platforms.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain
      # The desktop shell (a workspace member) links WebKitGTK on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev mold
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Guest crates (SDK, plugins, test plugins) also build for the plugin target.
      - run: cargo clippy --target wasm32-wasip2 -p kumikit-plugin -p kumikit-provider -p kumikit-tool -p kumikit-test-hello -p kumikit-test-probe -p kumikit-test-client -p kumikit-test-tool -p kumikit-provider-acp -- -D warnings
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo test --workspace --doc

  bundle:
    # Assembles the OS-independent UI bundle once, building this commit's kumikit CLI to
    # pack provider-acp.kkp (so new WIT worlds or manifest fields in the PR are accepted),
    # unblocking footprint-desktop, installers, macOS e2e-browser and Windows e2e-desktop.
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.installers == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y mold
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Assemble OS-independent UI bundle
        run: node scripts/bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: target/bundle
          retention-days: 1

  build-linux:
    # Builds the Linux debug test binaries once for e2e-browser-linux, e2e-desktop-linux,
    # panel-smoke-linux and templates, and checks the first-party default theme with the
    # newly built kumikit binary.
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev mold zstd
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Linux debug test binaries and test plugins
        run: |
          cargo build -p kumikit-core -p kumikit-web-relay -p kumikit-test-registry-fixture -p kumikit-test-plugins -p kumikit-test-client-store
          cargo build -p kumikit-shell --features test-hooks
      - name: Theme check (first-party default theme)
        run: ./target/debug/kumikit theme check --strict plugins/theme-default
      - name: Pack Linux test binaries
        run: |
          tar -I 'zstd -T0 -1' -cf target/linux-test-bins.tar.zst \
            target/debug/kumikit \
            target/debug/kumikit-desktop \
            target/debug/kumikit-web-relay \
            target/debug/registry-fixture \
            target/debug/client-store \
            target/kumikit-test/release/fake-acp-agent \
            target/kumikit-test/release/fake-ssh \
            target/kumikit-test/release/net-cut \
            target/kumikit-test/wasm32-wasip2/release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-test-bins
          path: target/linux-test-bins.tar.zst
          retention-days: 1

  e2e-browser-linux:
    # Browser-test build against a real core through the test relay (Chromium + WebKit).
    needs: [changes, bundle, build-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: target/bundle
      - uses: actions/download-artifact@v4
        with:
          name: linux-test-bins
          path: target
      - run: tar --zstd -xf target/linux-test-bins.tar.zst
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web/e2e
      - run: npx playwright test
        working-directory: web/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ubuntu-latest
          path: web/e2e/playwright-report

  e2e-browser-macos:
    # macOS WebKit browser suite (starts right after bundle; no WebDriver for WKWebView).
    needs: [changes, bundle]
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: target/bundle
      - run: cargo build -p kumikit-core -p kumikit-web-relay -p kumikit-test-registry-fixture -p kumikit-test-plugins
      - run: npx playwright install webkit
        working-directory: web/e2e
      - run: npx playwright test --project webkit
        working-directory: web/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-macos-latest
          path: web/e2e/playwright-report

  e2e-desktop-linux:
    # The M2–M5 exit tests on the real app over WebKitWebDriver (reuses build-linux binaries).
    needs: [changes, bundle, build-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: target/bundle
      - uses: actions/download-artifact@v4
        with:
          name: linux-test-bins
          path: target
      - # WebKitWebDriver's package is webkit2gtk-driver up to Ubuntu 24.04 and
        # webkitgtk-webdriver after it (also brings libwebkit2gtk-4.1-0 runtime).
        run: |
          tar --zstd -xf target/linux-test-bins.tar.zst
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          command -v WebKitWebDriver
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-linux-v2
      - name: Install tauri-driver (if not cached)
        run: |
          if [ ! -x "$HOME/.cargo/bin/tauri-driver" ]; then
            cargo install --locked tauri-driver --version 2.1.0
          fi
      - env:
          KUMIKIT_SKIP_BUILD: '1'
        run: sh scripts/desktop/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-ubuntu-latest
          path: target/e2e-desktop
          if-no-files-found: ignore

  e2e-desktop-windows:
    # The M2–M5 exit tests on Windows WebView2 (starts right after bundle).
    needs: [changes, bundle]
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: target/bundle
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-2.1.0-windows-v2
      - name: Install tauri-driver (if not cached)
        run: |
          if [ ! -x "$HOME/.cargo/bin/tauri-driver.exe" ]; then
            cargo install --locked tauri-driver --version 2.1.0
          fi
      - name: msedgedriver matching the installed WebView2
        shell: pwsh
        run: |
          $v = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}").pv
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath "$env:USERPROFILE\edgedriver"
          "$env:USERPROFILE\edgedriver" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - run: cargo build -p kumikit-core -p kumikit-test-plugins -p kumikit-test-registry-fixture && cargo build -p kumikit-shell --features test-hooks
      - run: |
          agent=$(dirname "$(find target/kumikit-test -type f -name fake-acp-agent.exe | head -n 1)")
          KK_APP="$PWD/target/debug/kumikit-desktop.exe" KK_CORE_BIN="$PWD/target/debug/kumikit.exe" \
          KK_FAKE_AGENT_DIR="$(cygpath -w "$(cd "$agent" && pwd)")" KK_BUNDLE="$PWD/target/bundle" \
          KK_NET_CUT="$(cygpath -w "$PWD/$(find target/kumikit-test -type f -name net-cut.exe | head -n 1)")" \
          KK_REGISTRY_FIXTURE="$(cygpath -w "$PWD/target/debug/registry-fixture.exe")" \
          KK_ARTIFACTS="$PWD/target/e2e-desktop" node --test --test-concurrency=1 web/e2e-desktop/exit.test.mjs web/e2e-desktop/exit-m3.test.mjs web/e2e-desktop/exit-m4.test.mjs web/e2e-desktop/exit-m5.test.mjs web/e2e-desktop/exit-m7.test.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-desktop-windows-latest
          path: target/e2e-desktop
          if-no-files-found: ignore

  panel-smoke-linux:
    # Sandboxed panels (ADR 0019) on Linux WebKitGTK (reuses build-linux binary).
    needs: [changes, build-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: linux-test-bins
          path: target
      - run: |
          tar --zstd -xf target/linux-test-bins.tar.zst
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 librsvg2-2 libsoup-3.0-0 xvfb
      - run: xvfb-run -a -s "-screen 0 1280x800x24" node scripts/desktop/panel-smoke.mjs target/debug/kumikit-desktop

  panel-smoke:
    # Sandboxed panels (ADR 0019) on macOS WKWebView and Windows WebView2 (starts right after changes).
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo build -p kumikit-shell --features test-hooks
      - if: runner.os == 'macOS'
        run: node scripts/desktop/panel-smoke.mjs target/debug/kumikit-desktop
      - if: runner.os == 'Windows'
        run: node scripts/desktop/panel-smoke.mjs target/debug/kumikit-desktop.exe

  templates:
    # The plugin author templates build, pack, sign, install and run as an author's would
    # (M4); this job keeps them from rotting.
    needs: [changes, build-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-debug
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: linux-test-bins
          path: target
      - run: tar --zstd -xf target/linux-test-bins.tar.zst
      - env:
          KUMIKIT_SKIP_BUILD: '1'
        run: sh scripts/check-templates.sh

  footprint-core:
    # Core cold start and idle memory budgets (00-overview). Starts right after changes.
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release
          save-if: false
      - run: sh scripts/footprint.sh

  footprint-desktop:
    # Desktop shell anonymous memory budget (ADR 0015). Starts right after bundle.
    needs: [changes, bundle]
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: target/bundle
      - run: sh scripts/desktop/footprint.sh

  installers:
    # Installers are built only to check their size; they are not published (M2).
    # PRs check Linux (deb, rpm, appimage); pushes to main check all three OSes.
    needs: [changes, bundle]
    if: github.event_name != 'pull_request' || needs.changes.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.installer-matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev rpm squashfs-tools file patchelf xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ui-bundle
          path: target/bundle
      - run: |
          cargo build --release -p kumikit-core
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p crates/kumikit-shell/binaries
          cp "target/release/kumikit$ext" "crates/kumikit-shell/binaries/kumikit-$triple$ext"
      - run: npx -y @tauri-apps/cli@2.12.5 build --config tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
        working-directory: crates/kumikit-shell
        # linuxdeploy is itself an AppImage; run it without FUSE.
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - if: runner.os == 'Linux'
        name: AppImage repack and smoke test
        run: |
          img=$(ls target/release/bundle/appimage/*.AppImage)
          node scripts/repack-appimage.mjs "$img"
          sh scripts/smoke-appimage.sh "$img" target/release/kumikit
      - run: node scripts/check-installer-size.mjs target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*-setup.exe
