# The client test plugin's manifest; tests change its permissions as they need.
id = "test.client"
name = "Client"
version = "0.1.0"
kind = ["integration"]
api = "^0.2"
[runtime]
wasm = "plugin.wasm"
worlds = ["kumikit:plugin/plugin@0.2.0"]
[permissions]
client = ["workspaces.list", "threads.read", "threads.create", "threads.send", "threads.cancel", "approvals.respond"]
workspaces = "linked"
schedules = true
[contributes]
commands = [
  { id = "workspaces", title = "Workspaces" },
  { id = "threads", title = "Threads" },
  { id = "get", title = "Get a thread" },
  { id = "providers", title = "Providers" },
  { id = "create", title = "Create a thread" },
  { id = "send", title = "Send" },
  { id = "cancel", title = "Cancel" },
  { id = "respond", title = "Answer an approval" },
  { id = "follow", title = "Follow a topic" },
  { id = "timer-set", title = "Set a timer" },
  { id = "timer-delete", title = "Delete a timer" },
  { id = "timers", title = "Timers" },
  { id = "fired", title = "Fired timers" },
]
