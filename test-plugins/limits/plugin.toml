# The limits test plugin's manifest: a declarative provider run by kumikit.provider-acp
# whose own small component reads its plan limits (ADR 0035). Tests pack it with the
# component.
id = "test.limits"
name = "Limits"
version = "0.1.0"
kind = ["provider"]
api = "^0.2"
[runtime]
wasm = "plugin.wasm"
worlds = ["kumikit:plugin/plugin@0.2.0", "kumikit:usage/reader@0.1.0"]
[permissions]
spawn = ["fake-acp-agent"]
[contributes]
providers = [
  { id = "agent", name = "Agent", acp = { command = "fake-acp-agent", args = [] } },
  { id = "broken", name = "Broken", acp = { command = "fake-acp-agent", args = [], env = { LIMITS = "broken" } } },
  { id = "none", name = "None", acp = { command = "fake-acp-agent", args = [], env = { LIMITS = "none" } } },
]
