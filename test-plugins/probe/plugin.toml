# The probe test plugin's manifest; tests pack it with the component.
id = "test.probe"
name = "Probe"
version = "0.1.0"
kind = ["provider"]
api = "^0.1"
[runtime]
wasm = "plugin.wasm"
worlds = ["kumikit:provider/plugin@0.1.0"]
[permissions]
spawn = ["fake-acp-agent"]
[contributes]
providers = [{ id = "probe", name = "Probe" }]
