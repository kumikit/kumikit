[package]
name = "kumikit-test-net-cut"
description = "Test only: a loopback TCP proxy whose network can be cut (a black hole) and restored"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "net_cut"
path = "src/lib.rs"

[[bin]]
name = "net-cut"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }
