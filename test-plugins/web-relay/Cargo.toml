[package]
name = "kumikit-web-relay"
description = "Test only: serves the browser-test UI bundle and relays its bridge to a real core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
kumikit-shell = { path = "../../crates/kumikit-shell" }
kumikit-test-net-cut = { version = "0.1.0", path = "../net-cut" }
kumikit-test-plugins.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync"] }
