# The tool test plugin's manifest; tests pack it with the component and the schemas.
id = "test.tool"
name = "Test tools"
version = "0.1.0"
kind = ["tool"]
api = "^0.2"
[runtime]
wasm = "plugin.wasm"
worlds = ["kumikit:tool/plugin@0.1.0"]
[permissions]
spawn = ["fake-acp-agent"]
[contributes]
tools = [
  { name = "echo", title = "Echo", description = "Answers with the text it is given.", input = "tools/echo.json", effect = "read" },
  { name = "cwd", title = "Working directory", description = "Where the tool runs.", input = "tools/empty.json", effect = "read" },
  { name = "touch", title = "Touch", description = "Pretends to change something.", input = "tools/echo.json", effect = "write" },
]
