[workspace]
resolver = "3"
members = [
  "crates/kumikit-protocol",
  "crates/kumikit-kernel",
  "crates/kumikit-package",
  "crates/kumikit-assets",
  "crates/kumikit-registry",
  "crates/kumikit-registry-tool",
  "crates/kumikit-plugin-host",
  "crates/kumikit-core",
  "crates/kumikit-shell",
  "sdk/rust",
  "sdk/rust-provider",
  "plugins/provider-acp",
  "test-plugins/fake-acp-agent",
  "test-plugins/fake-ssh",
  "test-plugins/net-cut",
  "test-plugins/registry-fixture",
  "test-plugins/hello",
  "test-plugins/probe",
  "test-plugins/kumikit-test-plugins",
  "test-plugins/web-relay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/kumikit/kumikit"
publish = false

[workspace.dependencies]
kumikit-protocol = { path = "crates/kumikit-protocol" }
kumikit-kernel = { path = "crates/kumikit-kernel" }
kumikit-package = { path = "crates/kumikit-package" }
kumikit-assets = { path = "crates/kumikit-assets" }
kumikit-registry = { path = "crates/kumikit-registry" }
kumikit-plugin-host = { path = "crates/kumikit-plugin-host" }
kumikit-plugin = { path = "sdk/rust" }
kumikit-provider = { path = "sdk/rust-provider" }
kumikit-test-plugins = { path = "test-plugins/kumikit-test-plugins" }

[workspace.lints.rust]
# Denied, not forbidden: the Windows named-pipe ACL module needs FFI and allows it locally.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
