[workspace]
resolver = "3"
members = ["crates/kumikit-protocol", "crates/kumikit-kernel", "crates/kumikit-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/kumikit/kumikit"
publish = false

[workspace.dependencies]
kumikit-protocol = { path = "crates/kumikit-protocol" }
kumikit-kernel = { path = "crates/kumikit-kernel" }

[workspace.lints.rust]
# Denied, not forbidden: the Windows named-pipe ACL module needs FFI and allows it locally.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
