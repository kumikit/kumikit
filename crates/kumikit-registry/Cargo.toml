[package]
name = "kumikit-registry"
description = "Kumikit plugin registries: the index format, fetching, install checks and the registry checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "time", "rt", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing = "0.1.44"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "test-util"] }
tempfile = "3.27.0"
