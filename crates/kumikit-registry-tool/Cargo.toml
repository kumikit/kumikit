[package]
name = "kumikit-registry-tool"
description = "The plugin registry's checker and index builder (`kumikit-registry check | build-index`), run by the registry's CI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "kumikit_registry_tool"
path = "src/lib.rs"

[[bin]]
name = "kumikit-registry"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
kumikit-assets.workspace = true
kumikit-package.workspace = true
kumikit-plugin-host.workspace = true
kumikit-protocol.workspace = true
kumikit-registry.workspace = true
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = "1"

[dev-dependencies]
kumikit-test-registry-fixture = { path = "../../test-plugins/registry-fixture" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
