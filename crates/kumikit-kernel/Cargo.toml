[package]
name = "kumikit-kernel"
description = "Kumikit kernel: domain model, event log, storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
kumikit-protocol.workspace = true
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Time zones for schedules (ADR 0024; Unlicense OR MIT). No fat tables or Android database.
jiff = { version = "0.2.46", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
thiserror = "2.0.21"
getrandom = "0.3"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "process", "io-util", "time"] }
tracing = "0.1.44"
ulid = "3.0.0"
which = "8.0.6"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
kumikit-test-plugins.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
