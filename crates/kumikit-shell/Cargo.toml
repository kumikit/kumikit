[package]
name = "kumikit-shell"
description = "The Kumikit desktop shell: window, local core discovery, connection bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "kumikit_shell"
path = "src/lib.rs"

[[bin]]
name = "kumikit-desktop"
path = "src/main.rs"

[features]
# Hooks for end-to-end tests (scripted file picker, readiness line). Never in releases.
test-hooks = []

[dependencies]
tauri = { version = "2.12.6", default-features = false, features = ["wry", "compression", "x11"] }
thiserror = "2"

[build-dependencies]
tauri-build = { version = "2.7.5", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
