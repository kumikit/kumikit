[package]
name = "kumikit-shell"
description = "The Kumikit desktop shell: window, local core discovery, connection bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "kumikit_shell"
path = "src/lib.rs"

[[bin]]
name = "kumikit-desktop"
path = "src/main.rs"

[features]
# Hooks for end-to-end tests (scripted file picker, readiness line). Never in releases.
test-hooks = []

[dependencies]
kumikit-protocol.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.6", default-features = false, features = ["wry", "compression", "x11"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[build-dependencies]
tauri-build = { version = "2.7.5", default-features = false }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
