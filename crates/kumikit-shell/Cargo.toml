[package]
name = "kumikit-shell"
description = "The Kumikit desktop shell: window, local core discovery, connection bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "kumikit_shell"
path = "src/lib.rs"

[[bin]]
name = "kumikit-desktop"
path = "src/main.rs"

[features]
# Hooks for end-to-end tests (scripted file picker, readiness line). Never in releases.
test-hooks = []

[dependencies]
kumikit-package.workspace = true
kumikit-protocol.workspace = true
semver = "1.0.28"
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.6", default-features = false, features = ["wry", "compression", "x11"] }
tauri-plugin-dialog = { version = "2.8.4", default-features = false, features = ["gtk3"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
sha2 = "0.10"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }

[target."cfg(windows)".dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[build-dependencies]
tauri-build = { version = "2.7.5", default-features = false, features = [] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
