[package]
name = "kumikit-core"
description = "The kumikit core binary: transports and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Enables test-only hooks (KUMIKIT_TEST_HTTP_ROUTES) for kumikit-test-kit; never
# enabled in the released kumikit binary.
test-hooks = ["kumikit-plugin-host/test-hooks"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/kumikit-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lib]
name = "kumikit_core"
path = "src/lib.rs"

[[bin]]
name = "kumikit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
jsonschema = { version = "0.61.2", default-features = false }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
kumikit-assets.workspace = true
kumikit-kernel.workspace = true
kumikit-plugin-host.workspace = true
kumikit-protocol.workspace = true
kumikit-registry = { workspace = true, features = ["archive"] }
kumikit-theme = { path = "../kumikit-theme" }
semver = "1.0.28"
jiff = { version = "0.2.46", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tempfile = "3.27.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "signal", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }

[dev-dependencies]
flate2 = "1"
kumikit-package.workspace = true
kumikit-test-plugins.workspace = true
kumikit-test-registry-fixture = { path = "../../test-plugins/registry-fixture" }
kumikit-registry-tool = { path = "../kumikit-registry-tool" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "net"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["process", "system"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
