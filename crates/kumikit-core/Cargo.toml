[package]
name = "kumikit-core"
description = "The kumikit core binary: transports and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "kumikit_core"
path = "src/lib.rs"

[[bin]]
name = "kumikit"
path = "src/main.rs"

[dependencies]
kumikit-kernel.workspace = true
kumikit-protocol.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "signal", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
