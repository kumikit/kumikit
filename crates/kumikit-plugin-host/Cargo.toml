[package]
name = "kumikit-plugin-host"
description = "Kumikit plugin host: WASM components, manifests, permissions, lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jsonschema = { version = "0.61.2", default-features = false }
kumikit-kernel.workspace = true
kumikit-package.workspace = true
kumikit-protocol.workspace = true
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time", "net"] }
toml = "1.2.1"
tracing = "0.1.44"
wasmtime = { version = "50.0.1", default-features = false, features = [
  "async",
  "cache",
  "call-hook",
  "component-model",
  "cranelift",
  "pooling-allocator",
  "runtime",
  "std",
  "addr2line",
] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p2"] }
# Outgoing HTTP for plugins (ADR 0023); its default sender is off, the host sends requests itself.
wasmtime-wasi-http = { version = "50.0.1", default-features = false, features = ["p2"] }
http = "1"
bytes = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[dev-dependencies]
sha2 = "0.10.9"
kumikit-test-plugins.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
# Tests write small components in the text format.
wasmtime = { version = "50.0.1", default-features = false, features = ["wat"] }
